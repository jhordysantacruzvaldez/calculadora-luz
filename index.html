<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de Luz</title>
    <link rel="stylesheet" href="estilos.css">
</head>

<body>

    <div class="contenedor">

        <h1>⚡ Calculadora de Luz</h1>

        <p class="descripcion">
            Calcula cuánto corresponde pagar por el consumo eléctrico de un piso.
        </p>

        <div class="formulario">

            <label for="lecturaAnterior">
                Lectura anterior (kWh)
            </label>

            <input 
                type="number" 
                id="lecturaAnterior" 
                placeholder="Ejemplo: 2110"
                step="0.01"
            >

            <label for="lecturaActual">
                Lectura actual (kWh)
            </label>

            <input 
                type="number" 
                id="lecturaActual" 
                placeholder="Ejemplo: 2173"
                step="0.01"
            >

            <label for="precioKwh">
                Precio por kWh
            </label>

            <input 
                type="number" 
                id="precioKwh" 
                value="0.6445"
                step="0.0001"
            >

            <label for="cargoFijo">
                Cargo fijo por piso
            </label>

            <input 
                type="number" 
                id="cargoFijo" 
                value="5.00"
                step="0.01"
            >

            <button onclick="calcular()">
                CALCULAR
            </button>

            <button class="limpiar" onclick="limpiar()">
                LIMPIAR
            </button>

        </div>

        <div class="resultados">

            <h2>Resultado</h2>

            <p id="consumo">
                Consumo: -
            </p>

            <p id="subtotal">
                Subtotal: -
            </p>

            <p id="igv">
                IGV (18%): -
            </p>

            <p id="total" class="total">
                TOTAL A PAGAR: -
            </p>

        </div>

    </div>

    <script src="calculadora.js"></script>

</body>
</html>
